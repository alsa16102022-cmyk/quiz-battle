version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: quiz_battle_db
    environment:
      POSTGRES_USER: quiz_user
      POSTGRES_PASSWORD: quiz_password
      POSTGRES_DB: quiz_battle_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz_user -d quiz_battle_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quiz_battle_network

  redis:
    image: redis:7-alpine
    container_name: quiz_battle_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quiz_battle_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz_battle_api
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://quiz_user:quiz_password@postgres:5432/quiz_battle_db
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: quiz_user
      DB_PASSWORD: quiz_password
      DB_NAME: quiz_battle_db
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:19000,http://localhost:8081
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - quiz_battle_network

volumes:
  postgres_data:
  redis_data:

networks:
  quiz_battle_network:
    driver: bridge
